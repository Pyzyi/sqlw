name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Inhalte + Server)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  container:
    name: Container – Build und Integrationstest
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sqlw:ci
      - run: e2e/container-test.sh sqlw:ci

  release:
    name: Release anlegen (bei neuer VERSION)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: container
    permissions:
      contents: write
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(tr -d ' \n\r' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION '$v' ist nicht x.y.z"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$v existiert bereits"; exit 0
          fi
          # Abschnitt der Version aus dem CHANGELOG als Release-Text
          awk -v ver="## v$v" 'index($0, ver)==1 {f=1; next} /^## v/ {f=0} f' CHANGELOG.md > notes.md
          {
            echo ""
            echo "### Installation / Update"
            echo "ZimaOS: App aktualisieren bzw. \`docker compose pull && docker compose up -d\`."
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:$v\`"
          } >> notes.md
          gh release create "v$v" --target "$GITHUB_SHA" --title "v$v" --notes-file notes.md
          echo "release=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Image veröffentlichen
    if: always() && github.event_name == 'push' && needs.container.result == 'success' && needs.release.result != 'failure'
    runs-on: ubuntu-24.04
    needs: [container, release]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Image-Name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.release == 'true' }}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
